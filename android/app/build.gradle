apply plugin: 'com.android.application'

android {
    namespace 'com.usmanclothrehra.pos'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.usmanclothrehra.pos'
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 200
        versionName '2.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            // Do not compress web assets so Capacitor can serve them
            ignoreAssetsPattern '!.svgz'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            // Signing config injected via CI environment variables
            // or replace with your own signingConfig block
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
}
