apply plugin: 'com.android.application'

android {
    namespace 'com.usmanclothrehra.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.usmanclothrehra.pos'
        minSdk 22
        targetSdk 34
        versionCode 200
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Prevent Gradle from compressing web assets — Capacitor needs them uncompressed
    androidResources {
        noCompress 'html', 'js', 'css', 'json', 'svg', 'webmanifest', 'map'
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    // Required by @capacitor/android for SplashScreen theme
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
