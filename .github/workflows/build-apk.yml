name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js ────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install npm dependencies ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # ── 5. Build Vite web app ─────────────────────────────────────────────
      - name: Build web app
        run: node node_modules/vite/bin/vite.js build
        env:
          NODE_ENV: production

      # ── 6. Copy web assets into Android assets folder ─────────────────────
      - name: Copy web assets into Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/
          echo "Web assets synced:"
          ls -lh android/app/src/main/assets/public/

      # ── 7. Android SDK — use pre-installed SDK on ubuntu-latest ───────────
      # ubuntu-latest already has Android SDK at $ANDROID_SDK_ROOT.
      # We only install the specific platform + build-tools we need.
      - name: Install Android SDK platform 34 and build-tools
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "Accepting licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Installing platform and build-tools..."
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          echo "SDK packages installed."

      # ── 8. Cache Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 9. Download Gradle wrapper JAR ────────────────────────────────────
      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android/gradle/wrapper
          # Download Gradle 8.4 wrapper jar from Gradle's own CDN
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar || \
          wget -q \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -O android/gradle/wrapper/gradle-wrapper.jar
          ls -lh android/gradle/wrapper/gradle-wrapper.jar

      # ── 10. Make gradlew executable ───────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Build debug APK ───────────────────────────────────────────────
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # ── 12. Verify and rename APK ─────────────────────────────────────────
      - name: Verify and rename APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found. Searching..."
            find android -name "*.apk" 2>/dev/null || echo "No APK found anywhere."
            exit 1
          fi
          mkdir -p release-apk
          cp "$APK_PATH" release-apk/UsmanClothPOS-v2.0.0.apk
          echo "APK size: $(du -sh release-apk/UsmanClothPOS-v2.0.0.apk)"

      # ── 13. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsmanClothPOS-APK
          path: release-apk/UsmanClothPOS-v2.0.0.apk
          retention-days: 30
          if-no-files-found: error
